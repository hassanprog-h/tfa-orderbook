<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TFA Order Book</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2311151d'/><rect x='7' y='8' width='18' height='4' rx='2' fill='%23f6465d'/><rect x='7' y='14' width='12' height='4' rx='2' fill='%23f6465d' opacity='.6'/><rect x='7' y='20' width='15' height='4' rx='2' fill='%232ebd85'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
      <div>
        <b>TFA Order Book</b>
        <small>The Finance Association · EPFL</small>
      </div>
    </div>

    <div class="ticker">
      <div class="symbol" id="symbol">TFA</div>
      <div class="last mono" id="last">—</div>
      <div class="change mono" id="change">—</div>
    </div>

    <dl class="stats mono">
      <div><dt>Bid</dt><dd class="up" id="stat-bid">—</dd></div>
      <div><dt>Ask</dt><dd class="down" id="stat-ask">—</dd></div>
      <div><dt>Spread</dt><dd id="stat-spread">—</dd></div>
      <div><dt>High</dt><dd id="stat-high">—</dd></div>
      <div><dt>Low</dt><dd id="stat-low">—</dd></div>
      <div><dt>Volume</dt><dd id="stat-volume">—</dd></div>
      <div><dt>Trades</dt><dd id="stat-trades">—</dd></div>
    </dl>

    <div class="controls">
      <button class="btn ghost" id="sim-toggle" title="Start / pause the simulated traders">
        <span class="sim-dot"></span><span id="sim-label">Bots</span>
      </button>
      <select id="sim-speed" class="btn ghost" title="Simulation speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="5">5×</option>
      </select>
      <button class="btn ghost" id="reset" title="Start a fresh market">Reset</button>
      <a class="btn ghost" href="/api/journal" download="journal.jsonl" title="Download the event-sourced journal">Journal</a>
      <a class="btn ghost" href="/docs" target="_blank" rel="noopener" title="Interactive API documentation">API</a>
    </div>

    <label class="me" title="Your trader name">
      <span class="avatar" id="avatar">?</span>
      <input id="trader" maxlength="24" spellcheck="false" autocomplete="off">
    </label>

    <div class="conn" id="conn"><span></span><b>Connecting</b></div>
  </header>

  <main class="layout">
    <section class="panel ladder">
      <header class="panel-head">
        <h2>Order book</h2>
        <span class="hint">click a price to use it</span>
      </header>
      <div class="ladder-cols"><span>Price</span><span>Size</span><span>Total</span></div>
      <div class="ladder-side" id="asks"></div>
      <div class="spread-row" id="spread-row">
        <span class="mid mono" id="mid">—</span>
        <span class="spread mono" id="spread">—</span>
      </div>
      <div class="ladder-side" id="bids"></div>
    </section>

    <section class="panel chart">
      <header class="panel-head">
        <h2>Price</h2>
        <span class="hint mono" id="ohlc"></span>
      </header>
      <div class="canvas-wrap"><canvas id="candles"></canvas></div>
    </section>

    <section class="panel depth">
      <header class="panel-head">
        <h2>Depth</h2>
        <span class="hint mono" id="depth-hint">cumulative size per price</span>
      </header>
      <div class="canvas-wrap"><canvas id="depth"></canvas></div>
    </section>

    <section class="panel ticket">
      <form id="ticket" autocomplete="off">
        <div class="seg side" role="tablist">
          <button type="button" data-side="buy" class="active">Buy</button>
          <button type="button" data-side="sell">Sell</button>
        </div>
        <div class="seg type" role="tablist">
          <button type="button" data-type="limit" class="active">Limit</button>
          <button type="button" data-type="market">Market</button>
        </div>

        <div class="field" id="price-field">
          <label for="price">Price</label>
          <div class="stepper">
            <button type="button" data-step="-1" aria-label="One tick lower">−</button>
            <input id="price" class="mono" inputmode="decimal" placeholder="0.00">
            <button type="button" data-step="1" aria-label="One tick higher">+</button>
          </div>
          <div class="chips">
            <button type="button" data-fill="bid">Bid</button>
            <button type="button" data-fill="mid">Mid</button>
            <button type="button" data-fill="ask">Ask</button>
          </div>
        </div>

        <div class="field">
          <label for="qty">Quantity</label>
          <input id="qty" class="mono" type="number" min="1" step="1" value="10">
          <div class="chips">
            <button type="button" data-qty="1">1</button>
            <button type="button" data-qty="5">5</button>
            <button type="button" data-qty="10">10</button>
            <button type="button" data-qty="25">25</button>
            <button type="button" data-qty="50">50</button>
            <button type="button" data-qty="100">100</button>
          </div>
        </div>

        <div class="row-2">
          <div class="field">
            <label for="tif">Time in force</label>
            <select id="tif">
              <option value="gtc">GTC · rests</option>
              <option value="ioc">IOC · now or never</option>
              <option value="fok">FOK · all or nothing</option>
            </select>
          </div>
          <label class="check" id="post-only-field">
            <input id="post-only" type="checkbox">
            <span>Post-only</span>
          </label>
        </div>

        <div class="preview mono" id="preview"></div>

        <button type="submit" class="submit buy" id="submit">Buy</button>
      </form>

      <div class="account" id="account"></div>
    </section>

    <section class="panel bottom">
      <nav class="tabs" id="tabs">
        <button data-tab="orders" class="active">Open orders <span class="count" id="count-orders">0</span></button>
        <button data-tab="trades">Trades</button>
        <button data-tab="leaderboard">Leaderboard</button>
        <button data-tab="activity">My activity</button>
        <button data-tab="about">How it works</button>
        <span class="spacer"></span>
        <button class="btn ghost small" id="cancel-all" hidden>Cancel all</button>
      </nav>
      <div class="tab-body" id="tab-body"></div>
    </section>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <template id="about">
    <div class="about">
      <div>
        <h3>Matching rules</h3>
        <p>Every order is matched against the other side while prices cross: a buy at or above the best ask, a sell at or below the best bid.
          <b>Best price first</b>, then <b>earliest order first</b> at equal prices. A trade always executes at the <b>resting order's price</b>.
          Whatever cannot be filled rests in the book (unless it is a market, IOC or FOK order).</p>
      </div>
      <div>
        <h3>Order types</h3>
        <p><b>Limit GTC</b> rests until filled or cancelled. <b>IOC</b> fills what it can now and cancels the rest.
          <b>FOK</b> fills entirely or does nothing. <b>Market</b> takes any price and never rests.
          <b>Post-only</b> is rejected if it would trade immediately, so it always adds liquidity.</p>
      </div>
      <div>
        <h3>Under the hood</h3>
        <p>Prices are integer ticks (0.01), never floats. Your own orders can't trade with each other (self-trade prevention).
          Every command is journaled: download the journal and rebuild the exact same book with
          <code>python -m orderbook replay journal.jsonl</code>.</p>
      </div>
      <div>
        <h3>The bots</h3>
        <p><b>mm-alpha</b> quotes both sides and skews its prices against its inventory.
          <b>noise-*</b> send random orders around fair value. <b>trend-1</b> chases momentum.
          Trade aggressively and you will move the price.</p>
      </div>
    </div>
  </template>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
