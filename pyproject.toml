[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfa-orderbook"
version = "1.0.0"
description = "A price-time priority limit order book and matching engine, with a live trading UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = [
    "tfa-orderbook[server]",
    "pytest>=8",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["orderbook*", "server*"]

[tool.setuptools.package-data]
server = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "orderbook"]
addopts = "-q --doctest-modules"
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
